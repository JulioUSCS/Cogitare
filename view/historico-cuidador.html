<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogitare - Histórico Cuidadores</title>
  <link rel="stylesheet" href="/css/historico.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <nav class="navbar" role="navigation" aria-label="Menu principal">
      <a class="logo" href="/view/index.html">
        <img src="/imagens/logotipoCogitareSemFundo.png" alt="Cogitare">
        <span class="logo-text">Cogitare</span>
      </a>
  
      <!-- botão hambúrguer (mobile) -->
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
        <span class="sr-only">Menu</span>
      </button>
  
      <ul id="primary-navigation" class="nav-menu">
        <li><a href="/view/index.html"><i class="fas fa-tachometer-alt"></i><span>Painel</span></a></li>
        <li><a href="/view/cuidador.html"><i class="fas fa-user-nurse"></i><span>Cuidadores</span></a></li>
        <li><a href="/view/responsavel.html"><i class="fas fa-users"></i><span>Responsáveis</span></a></li>
        <li><a href="/view/idoso.html"><i class="fas fa-user-friends"></i><span>Idosos</span></a></li>
        <li><a href="/view/atendimento.html"><i class="fas fa-calendar-check"></i><span>Atendimentos</span></a></li>
        <li><a href="/view/pagamento.html"><i class="fas fa-wallet"></i><span>Pagamentos</span></a></li>
        <li><a href="/view/historico.html"><i class="fas fa-history"></i><span>Histórico</span></a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a></li>
      </ul>
      
    </nav>

    <main class="main-content">
      <div class="historico-container">
        <header class="header">
        <div class="header-top">
          <h1>Histórico de Cuidadores</h1>
          <input type="text" placeholder="Buscar operação..." class="search-input" />
        </div>
        <div class="header-actions">
          <a href="/view/historico.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Voltar ao Histórico Geral
          </a>
        </div>
      </header>

      <!-- Tabela de Histórico de Cuidadores -->
      <section class="table-container">
        <table class="historico-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cuidador</th>
              <th>Operação</th>
              <th>Data/Hora</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="text-align:center;">Carregando histórico...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Paginação -->
      <div class="pagination-container">
        <div class="pagination-info">
          <span id="paginationInfo">Mostrando 0 de 0 registros</span>
        </div>
        <div class="pagination-controls">
          <button id="btnPrev" class="btn-pagination" disabled>
            <i class="fas fa-chevron-left"></i> Anterior
          </button>
          <span id="pageNumbers" class="page-numbers"></span>
          <button id="btnNext" class="btn-pagination">
            Próximo <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
      </div>
    </main>

  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/historico-cuidador.js"></script>
  <script>lucide.createIcons();</script>
  <script src='https://www.noupe.com/embed/019a01aae20d7c72a2e0e316038a874bd730.js'></script>
</body>

</html>
