<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogitare - Idosos</title>
  <link rel="stylesheet" href="/css/idoso.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" /> <!-- Novo CSS do modal -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <nav class="navbar" role="navigation" aria-label="Menu principal">
      <a class="logo" href="/view/index.html">
        <img src="/imagens/logotipoCogitareSemFundo.png" alt="Cogitare">
        <span class="logo-text">Cogitare</span>
      </a>
  
      <!-- botão hambúrguer (mobile) -->
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
        <span class="sr-only">Menu</span>
      </button>
  
      <ul id="primary-navigation" class="nav-menu">
        <li><a href="/view/index.html"><i class="fas fa-tachometer-alt"></i><span>Painel</span></a></li>
        <li><a href="/view/cuidador.html"><i class="fas fa-user-nurse"></i><span>Cuidadores</span></a></li>
        <li><a href="/view/responsavel.html"><i class="fas fa-users"></i><span>Responsáveis</span></a></li>
        <li><a href="/view/idoso.html"><i class="fas fa-user-friends"></i><span>Idosos</span></a></li>
        <li><a href="/view/atendimento.html"><i class="fas fa-calendar-check"></i><span>Atendimentos</span></a></li>
      <li><a href="/view/pagamento.html"><i class="fas fa-wallet"></i><span>Pagamentos</span></a></li>
      <li><a href="/view/avaliacao.html"><i class="fas fa-star"></i><span>Avaliações</span></a></li>
      <li><a href="/view/chat.html"><i class="fas fa-comments"></i><span>Chat</span></a></li>
      <li><a href="/view/historico.html"><i class="fas fa-history"></i><span>Histórico</span></a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a></li>
      </ul>
      
    </nav>

    <main class="main-content">
      <header class="header">
        <div class="header-top">
          <h1>Lista de Idosos</h1>
          <input type="text" placeholder="Buscar idoso..." class="search-input" aria-label="Buscar idoso" />
        </div>
        <button id="btnToggleForm" class="btn-add">+ Novo Idoso</button>
      </header>
      

      <!-- Tabela de Idosos -->
      <section class="table-container">
        <table class="idosos-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>Idade</th>
              <th>Sexo</th>
              <th>Condições</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas de idosos serão inseridas dinamicamente pelo JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Modal para formulário -->
  <div id="modalOverlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modalTitle"
    aria-modal="true">
    <form id="formIdoso" class="modal-content">
      <button class="btn-fechar-modal" id="btnCloseModal" aria-label="Fechar formulário">&times;</button>
      <h2 id="modalTitle">Adicionar Novo Idoso</h2>

      <label for="idResponsavel">Responsável:</label>
      <select id="idResponsavel" name="idResponsavel" required>
        <!-- Opções dinâmicas -->
      </select>

      <label for="idMobilidade">Mobilidade:</label>
      <select id="idMobilidade" name="idMobilidade" required>
        <!-- Opções dinâmicas -->
      </select>

      <label for="idNivelAutonomia">Nível de Autonomia:</label>
      <select id="idNivelAutonomia" name="idNivelAutonomia" required>
        <!-- Opções dinâmicas -->
      </select>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" maxlength="100" required />

      <label for="dataNascimento">Data de Nascimento:</label>
      <input type="date" id="dataNascimento" name="dataNascimento" required />

      <label for="sexo">Sexo:</label>
      <select id="sexo" name="sexo" required>
        <option value="">Selecione</option>
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
        <option value="Outro">Outro</option>
      </select>

      <label for="cuidadosMedicos">Cuidados Médicos:</label>
      <textarea id="cuidadosMedicos" name="cuidadosMedicos" rows="3"
        placeholder="Descreva os cuidados médicos"></textarea>

      <label for="descricaoExtra">Descrição Extra:</label>
      <textarea id="descricaoExtra" name="descricaoExtra" rows="3" placeholder="Informações adicionais"></textarea>

      <label for="fotoUrl">URL da Foto:</label>
      <input type="url" id="fotoUrl" name="fotoUrl" placeholder="https://exemplo.com/foto.jpg" />

      <button type="submit">Salvar Idoso</button>
    </form>
  </div>


  <script src="/js/sidebar.js"></script>
  <script src="/js/idoso.js"></script>
  <script>
    lucide.createIcons();
    document.addEventListener('DOMContentLoaded', () => {
      carregarIdosos(); // chama a função assim que a página terminar de carregar
    });
  </script>

</body>

</html>
