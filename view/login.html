<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogitare - Login Administrador</title>
    <link rel="stylesheet" href="/css/login.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon">
</head>

<body>
    <div class="container-login">
        <div class="wrap-login">
            <div class="login-pic">
                <img src="/imagens/logotipoCogitareSemFundo.png" alt="Logotipo Cogitare">
            </div>

            <form class="login-form" onsubmit="verificaUsuario(event)">
                <span class="login-form-title">
                    Bem-vindo(a) Cogitare
                </span>

                <div class="wrap-input">
                    <input class="input" type="text" id="usuario" name="usuario" placeholder="Usuário" required>
                    <span class="focus-input"></span>
                    <span class="symbol-input">
                        <i class="fa fa-user" aria-hidden="true"></i>
                    </span>
                </div>

                <div class="wrap-input">
                    <input class="input" type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
                    <span class="focus-input"></span>
                    <span class="symbol-input">
                        <i class="fa fa-lock" aria-hidden="true"></i>
                    </span>
                </div>

                <div class="container-login-form-btn">
                    <button type="submit" class="login-form-btn">
                        Entrar
                    </button>
                </div>

            </form>
        </div>
    </div>
    
    <script src="/js/feedback.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
