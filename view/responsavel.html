<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogitare - Responsáveis</title>
  <link rel="stylesheet" href="/css/responsavel.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <nav class="navbar" role="navigation" aria-label="Menu principal">
      <a class="logo" href="/view/index.html">
        <img src="/imagens/logotipoCogitareSemFundo.png" alt="Cogitare">
        <span class="logo-text">Cogitare</span>
      </a>
  
      <!-- botão hambúrguer (mobile) -->
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
        <span class="sr-only">Menu</span>
      </button>
  
      <ul id="primary-navigation" class="nav-menu">
        <li><a href="/view/index.html"><i class="fas fa-tachometer-alt"></i><span>Painel</span></a></li>
        <li><a href="/view/cuidador.html"><i class="fas fa-user-nurse"></i><span>Cuidadores</span></a></li>
        <li><a href="/view/responsavel.html"><i class="fas fa-users"></i><span>Responsáveis</span></a></li>
        <li><a href="/view/idoso.html"><i class="fas fa-user-friends"></i><span>Idosos</span></a></li>
        <li><a href="/view/atendimento.html"><i class="fas fa-calendar-check"></i><span>Atendimentos</span></a></li>
      <li><a href="/view/pagamento.html"><i class="fas fa-wallet"></i><span>Pagamentos</span></a></li>
      <li><a href="/view/avaliacao.html"><i class="fas fa-star"></i><span>Avaliações</span></a></li>
      <li><a href="/view/chat.html"><i class="fas fa-comments"></i><span>Chat</span></a></li>
      <li><a href="/view/historico.html"><i class="fas fa-history"></i><span>Histórico</span></a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a></li>
      </ul>
      
    </nav>

    <main class="main-content">
      <header class="header">
        <div class="header-top">
          <h1>Lista de Responsáveis</h1>
          <input type="text" placeholder="Buscar responsável..." class="search-input" />
        </div>
        <!-- Botão abaixo do título -->
        <button id="btnToggleForm" class="btn-add">+ Novo Responsável</button>
      </header>
      

      <!-- Tabela de Responsáveis -->
      <section class="table-container">
        <table class="responsaveis-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Telefone</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas de responsáveis serão inseridas dinamicamente pelo JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Modal para formulário -->
  <div id="modalOverlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modalTitle"
    aria-modal="true">
    <form id="formResponsavel" class="modal-content">
      <button class="btn-fechar-modal" id="btnCloseModal" aria-label="Fechar formulário">&times;</button>
      <h2 id="modalTitle">Adicionar Novo Responsável</h2>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" maxlength="100" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" maxlength="100" />

      <label for="telefone">Telefone:</label>
      <input type="text" id="telefone" name="telefone" maxlength="20" />

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" maxlength="20" />

      <label for="dataNascimento">Data de Nascimento:</label>
      <input type="date" id="dataNascimento" name="dataNascimento" />

      <label for="fotoUrl">URL da Foto:</label>
      <input type="url" id="fotoUrl" name="fotoUrl" placeholder="https://exemplo.com/foto.jpg" />

      <button type="submit">Salvar Responsável</button>
    </form>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/responsavel.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
