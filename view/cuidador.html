<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogitare - Cuidadores</title>
  <link rel="stylesheet" href="/css/cuidador.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <nav class="navbar" role="navigation" aria-label="Menu principal">
      <a class="logo" href="/view/index.html">
        <img src="/imagens/logotipoCogitareSemFundo.png" alt="Cogitare">
        <span class="logo-text">Cogitare</span>
      </a>
  
      <!-- botão hambúrguer (mobile) -->
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
        <span class="sr-only">Menu</span>
      </button>
  
      <ul id="primary-navigation" class="nav-menu">
        <li><a href="/view/index.html"><i class="fas fa-tachometer-alt"></i><span>Painel</span></a></li>
        <li><a href="/view/cuidador.html"><i class="fas fa-user-nurse"></i><span>Cuidadores</span></a></li>
        <li><a href="/view/responsavel.html"><i class="fas fa-users"></i><span>Responsáveis</span></a></li>
        <li><a href="/view/idoso.html"><i class="fas fa-user-friends"></i><span>Idosos</span></a></li>
        <li><a href="/view/atendimento.html"><i class="fas fa-calendar-check"></i><span>Atendimentos</span></a></li>
      <li><a href="/view/pagamento.html"><i class="fas fa-wallet"></i><span>Pagamentos</span></a></li>
      <li><a href="/view/avaliacao.html"><i class="fas fa-star"></i><span>Avaliações</span></a></li>
      <li><a href="/view/chat.html"><i class="fas fa-comments"></i><span>Chat</span></a></li>
      <li><a href="/view/historico.html"><i class="fas fa-history"></i><span>Histórico</span></a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a></li>
      </ul>
      
    </nav>

    <main class="main-content">
      <header class="header">
        <div class="header-top">
          <h1>Lista de Cuidadores</h1>
          <input type="text" placeholder="Buscar cuidador..." class="search-input" />
        </div>
        <button id="btnToggleForm" class="btn-add">+ Novo Cuidador</button>
      </header>


      <!-- Tabela de Cuidadores -->
      <section class="table-container">
        <table class="cuidadores-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Telefone</th>
              <th>Idade</th>
              <th>Biografia</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="8" style="text-align:center;">Carregando cuidadores...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

  </div>

  <!-- MODAL FORM -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">

      <form id="formCuidador" class="modal-content">
        <h2 id="formTitle">Cadastrar Cuidador</h2>
        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Nome completo" required />
        <label>Email:</label>
        <input type="email" name="email" placeholder="E-mail" required />
        <label>Telefone:</label>
        <input type="text" name="telefone" placeholder="Telefone" required />
        <label>Data de nascimento:</label>
        <input type="date" name="dataNascimento" required />
        <label>Foto:</label>
        <input type="url" name="fotoUrl" placeholder="URL da foto" />
        <label>Biografia:</label>
        <textarea name="biografia" placeholder="Biografia"></textarea>

        <label>Fumante:</label>
        <select name="fumante">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>

        <label>Tem filhos:</label>
        <select name="temFilhos">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>

        <label>Possui CNH:</label>
        <select name="possuiCNH">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>

        <label>Tem carro:</label>
        <select name="temCarro">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>

        <div class="form-actions">
          <button type="submit" class="btn-save">Salvar cuidador</button>
        </div>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/cuidador.js"></script>
</body>

</html>
