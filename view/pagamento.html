<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogitare - Pagamentos</title>
  <link rel="stylesheet" href="/css/pagamento.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" />
  <link rel="shortcut icon" href="/imagens/logotipoCogitareSemFundo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <nav class="navbar" role="navigation" aria-label="Menu principal">
      <a class="logo" href="/view/index.html">
        <img src="/imagens/logotipoCogitareSemFundo.png" alt="Cogitare">
        <span class="logo-text">Cogitare</span>
      </a>
  
      <!-- botão hambúrguer (mobile) -->
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
        <span class="sr-only">Menu</span>
      </button>
  
      <ul id="primary-navigation" class="nav-menu">
        <li><a href="/view/index.html"><i class="fas fa-tachometer-alt"></i><span>Painel</span></a></li>
        <li><a href="/view/cuidador.html"><i class="fas fa-user-nurse"></i><span>Cuidadores</span></a></li>
        <li><a href="/view/responsavel.html"><i class="fas fa-users"></i><span>Responsáveis</span></a></li>
        <li><a href="/view/idoso.html"><i class="fas fa-user-friends"></i><span>Idosos</span></a></li>
        <li><a href="/view/atendimento.html"><i class="fas fa-calendar-check"></i><span>Atendimentos</span></a></li>
      <li><a href="/view/pagamento.html"><i class="fas fa-wallet"></i><span>Pagamentos</span></a></li>
      <li><a href="/view/avaliacao.html"><i class="fas fa-star"></i><span>Avaliações</span></a></li>
            <li><a href="/view/chat.html"><i class="fas fa-comments"></i><span>Chat</span></a></li>
            <li><a href="/view/financeiro.html"><i class="fas fa-chart-line"></i><span>Financeiro</span></a></li>
            <li><a href="/view/historico.html"><i class="fas fa-history"></i><span>Histórico</span></a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a></li>
      </ul>
      
    </nav>

    <main class="main-content">
      <div class="pagamento-container">
        <header class="header">
        <div class="header-top">
          <h1>Lista de Pagamentos</h1>
          <input type="text" placeholder="Buscar pagamento..." class="search-input" />
        </div>
        <button id="btnToggleForm" class="btn-add">+ Novo Pagamento</button>
      </header>


      <!-- Tabela de Pagamentos -->
      <section class="table-container">
        <table class="pagamentos-table">
          <thead>
            <tr>
              <th>Pagamento</th>
              <th>Atendimento</th>
              <th>Responsável</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Data do Pagamento</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7" style="text-align:center;">Carregando pagamentos...</td>
            </tr>
          </tbody>
        </table>
      </section>
      </div>
    </main>

  </div>

  <!-- MODAL FORM -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">

      <form id="formPagamento" class="modal-content">
        <h2 id="formTitle">Cadastrar Pagamento</h2>
        <label for="idAtendimento">Número do Atendimento</label>
        <input type="number" id="idAtendimento" name="idAtendimento" placeholder="Informe o número do atendimento" min="1" required />
        <label for="metodoPagamento">Forma de Pagamento</label>
        <select id="metodoPagamento" name="metodoPagamento" required>
          <option value="">Selecione o método</option>
          <option value="PIX">PIX</option>
          <option value="Cartão de Crédito">Cartão de Crédito</option>
          <option value="Cartão de Débito">Cartão de Débito</option>
          <option value="Boleto">Boleto</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
        <label for="statusPagamento">Status do Pagamento</label>
        <select id="statusPagamento" name="statusPagamento" required>
          <option value="">Selecione o status</option>
          <option value="Pendente">Pendente</option>
          <option value="Pago">Pago</option>
          <option value="Processando">Processando</option>
          <option value="Cancelado">Cancelado</option>
        </select>
        <label for="codigoTransacao">Código da Transação (opcional)</label>
        <input type="text" id="codigoTransacao" name="codigoTransacao" placeholder="Informe o código emitido pela operadora" />
        
        <div class="modal-buttons">
          <button type="button" id="btnCancel" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-save">Salvar</button>
        </div>
      </form>

    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/pagamento.js"></script>
  <script src='https://www.noupe.com/embed/019a01aae20d7c72a2e0e316038a874bd730.js'></script>
</body>

</html>
